<svg viewBox="0 0 880 360" width="880" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="360" fill="#0f172a" />
  <text x="440" y="24" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Skema Wiring NodeMCU ESP8266 + Relay HL-52S V1.0 + 2 LED + ThingsBoard</text>

  <!-- ThingsBoard Cloud -->
  <rect x="16" y="44" width="150" height="285" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="91" y="66" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">ThingsBoard</text>
  <text x="91" y="81" text-anchor="middle" fill="#94a3b8" font-size="10">MQTT Port 1883</text>

  <rect x="28" y="96" width="126" height="84" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="38" y="114" fill="#f8fafc" font-size="11" font-weight="600">Switch 1</text>
  <text x="38" y="132" fill="#94a3b8" font-size="10">LED Widget 1: led1</text>
  <text x="38" y="150" fill="#38bdf8" font-size="9.5" font-family="monospace">RPC: setRelay1</text>
  <text x="38" y="166" fill="#94a3b8" font-size="9.5" font-family="monospace">RPC: getRelay1</text>

  <rect x="28" y="194" width="126" height="84" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="38" y="212" fill="#f8fafc" font-size="11" font-weight="600">Switch 2</text>
  <text x="38" y="230" fill="#94a3b8" font-size="10">LED Widget 2: led2</text>
  <text x="38" y="248" fill="#38bdf8" font-size="9.5" font-family="monospace">RPC: setRelay2</text>
  <text x="38" y="264" fill="#94a3b8" font-size="9.5" font-family="monospace">RPC: getRelay2</text>

  <text x="91" y="308" text-anchor="middle" fill="#94a3b8" font-size="9.5">WiFi + Access Token</text>

  <!-- MQTT Link -->
  <path d="M 166 186 L 212 186" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="4 3" />
  <text x="189" y="177" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="600">MQTT</text>

  <!-- NodeMCU ESP8266 -->
  <rect x="212" y="44" width="165" height="285" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="294.5" y="66" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">NodeMCU ESP8266</text>
  <text x="294.5" y="81" text-anchor="middle" fill="#94a3b8" font-size="10">MicroPython (umqtt)</text>

  <rect x="304" y="99" width="73" height="22" rx="3" fill="#334155" />
  <text x="370" y="114" text-anchor="end" fill="#f87171" font-size="10.5" font-weight="700">VU (5V)</text>
  <circle cx="377" cy="110" r="3.5" fill="#ef4444" />

  <rect x="304" y="131" width="73" height="22" rx="3" fill="#334155" />
  <text x="370" y="146" text-anchor="end" fill="#fb923c" font-size="10.5" font-weight="700">3V (3.3V)</text>
  <circle cx="377" cy="142" r="3.5" fill="#f97316" />

  <rect x="304" y="168" width="73" height="22" rx="3" fill="#334155" />
  <text x="370" y="183" text-anchor="end" fill="#60a5fa" font-size="10.5" font-weight="700">D1 (GPIO5)</text>
  <circle cx="377" cy="179" r="3.5" fill="#3b82f6" />

  <rect x="304" y="200" width="73" height="22" rx="3" fill="#334155" />
  <text x="370" y="215" text-anchor="end" fill="#c084fc" font-size="10.5" font-weight="700">D2 (GPIO4)</text>
  <circle cx="377" cy="211" r="3.5" fill="#a855f7" />

  <rect x="304" y="242" width="73" height="22" rx="3" fill="#334155" />
  <text x="370" y="257" text-anchor="end" fill="#cbd5e1" font-size="10.5" font-weight="700">G (GND)</text>
  <circle cx="377" cy="253" r="3.5" fill="#94a3b8" />

  <text x="294.5" y="302" text-anchor="middle" fill="#94a3b8" font-size="9.5">Active-LOW: 0=ON, 1=OFF</text>

  <!-- Wires ESP8266 -> HL-52S -->
  <path d="M 377 110 L 457 110" stroke="#ef4444" stroke-width="2.2" fill="none" />
  <path d="M 377 179 L 457 179" stroke="#3b82f6" stroke-width="2.2" fill="none" />
  <path d="M 377 211 L 457 211" stroke="#a855f7" stroke-width="2.2" fill="none" />
  <path d="M 377 253 L 457 253" stroke="#94a3b8" stroke-width="2.2" fill="none" />

  <!-- 3.3V to COM1 & COM2 -->
  <path d="M 377 142 L 417 142 L 417 58 L 687 58 L 687 136 L 632 136" stroke="#f97316" stroke-width="2" fill="none" />
  <path d="M 687 136 L 687 236 L 632 236" stroke="#f97316" stroke-width="2" fill="none" />
  <circle cx="687" cy="136" r="3" fill="#f97316" />
  <text x="545" y="51" text-anchor="middle" fill="#fb923c" font-size="9.5" font-weight="600">3.3V ke COM1 &amp; COM2</text>

  <!-- GND to LEDs -->
  <path d="M 424 253 L 424 338 L 822 338 L 822 127" stroke="#94a3b8" stroke-width="2" fill="none" />
  <circle cx="424" cy="253" r="3" fill="#94a3b8" />

  <!-- Relay HL-52S V1.0 -->
  <rect x="457" y="72" width="175" height="257" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5" />
  <text x="544.5" y="92" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Relay HL-52S V1.0</text>
  <text x="544.5" y="105" text-anchor="middle" fill="#93c5fd" font-size="9.5">2-Ch 5V | Active-LOW</text>

  <rect x="457" y="99" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="464" y="114" fill="#f87171" font-size="10.5" font-weight="700">VCC</text>
  <circle cx="457" cy="110" r="3.5" fill="#ef4444" />

  <rect x="457" y="168" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="464" y="183" fill="#93c5fd" font-size="10.5" font-weight="700">IN1</text>
  <circle cx="457" cy="179" r="3.5" fill="#3b82f6" />

  <rect x="457" y="200" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="464" y="215" fill="#d8b4fe" font-size="10.5" font-weight="700">IN2</text>
  <circle cx="457" cy="211" r="3.5" fill="#a855f7" />

  <rect x="457" y="242" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="464" y="257" fill="#cbd5e1" font-size="10.5" font-weight="700">GND</text>
  <circle cx="457" cy="253" r="3.5" fill="#94a3b8" />

  <rect x="464" y="276" width="94" height="30" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="511" y="289" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-weight="600">Jumper JD-VCC</text>
  <text x="511" y="301" text-anchor="middle" fill="#4ade80" font-size="8.5">[VCC - JD-VCC ON]</text>

  <!-- Relay 1 & 2 Terminals -->
  <rect x="514" y="116" width="118" height="62" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="522" y="130" fill="#e2e8f0" font-size="9.5" font-weight="700">Relay 1</text>
  <text x="594" y="130" fill="#4ade80" font-size="9">NO1</text>
  <text x="594" y="148" fill="#fb923c" font-size="9">COM1</text>
  <text x="594" y="166" fill="#64748b" font-size="9">NC1</text>
  <circle cx="632" cy="127" r="3.5" fill="#22c55e" />
  <circle cx="632" cy="136" r="3.5" fill="#f97316" />
  <circle cx="632" cy="162" r="3.5" fill="#64748b" />
  <line x1="566" y1="144" x2="590" y2="162" stroke="#fbbf24" stroke-width="2" />

  <rect x="514" y="204" width="118" height="62" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="522" y="218" fill="#e2e8f0" font-size="9.5" font-weight="700">Relay 2</text>
  <text x="594" y="218" fill="#4ade80" font-size="9">NO2</text>
  <text x="594" y="238" fill="#fb923c" font-size="9">COM2</text>
  <text x="594" y="256" fill="#64748b" font-size="9">NC2</text>
  <circle cx="632" cy="215" r="3.5" fill="#22c55e" />
  <circle cx="632" cy="236" r="3.5" fill="#f97316" />
  <circle cx="632" cy="252" r="3.5" fill="#64748b" />
  <line x1="566" y1="234" x2="590" y2="252" stroke="#fbbf24" stroke-width="2" />

  <!-- Output LED 1 -->
  <path d="M 632 127 L 702 127" stroke="#22c55e" stroke-width="2.2" fill="none" />
  <rect x="702" y="120" width="38" height="14" rx="2" fill="#d97706" stroke="#fbbf24" />
  <text x="721" y="130" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="700">220Ω</text>
  <path d="M 740 127 L 772 127" stroke="#22c55e" stroke-width="2.2" fill="none" />
  <circle cx="784" cy="127" r="11" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
  <text x="784" y="150" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">LED 1 (Merah)</text>
  <path d="M 795 127 L 822 127" stroke="#94a3b8" stroke-width="2" fill="none" />

  <!-- Output LED 2 -->
  <path d="M 632 215 L 702 215" stroke="#22c55e" stroke-width="2.2" fill="none" />
  <rect x="702" y="208" width="38" height="14" rx="2" fill="#d97706" stroke="#fbbf24" />
  <text x="721" y="218" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="700">220Ω</text>
  <path d="M 740 215 L 772 215" stroke="#22c55e" stroke-width="2.2" fill="none" />
  <circle cx="784" cy="215" r="11" fill="#22c55e" stroke="#86efac" stroke-width="2" />
  <text x="784" y="238" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">LED 2 (Hijau)</text>
  <path d="M 795 215 L 822 215" stroke="#94a3b8" stroke-width="2" fill="none" />
  <circle cx="822" cy="215" r="3" fill="#94a3b8" />

  <text x="822" y="352" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-weight="600">Ke GND (G)</text>
</svg>
