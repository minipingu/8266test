<svg viewBox="0 0 860 350" width="860" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="350" fill="#0f172a" />
  <text x="430" y="24" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Skema Wiring Relay HL-52S V1.0 + NodeMCU ESP8266 untuk Lampu 220V AC</text>

  <!-- NodeMCU ESP8266 -->
  <rect x="14" y="44" width="165" height="275" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="96.5" y="66" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">NodeMCU ESP8266</text>
  <text x="96.5" y="81" text-anchor="middle" fill="#94a3b8" font-size="10">Sisi Tegangan Rendah (DC)</text>

  <rect x="106" y="99" width="73" height="22" rx="3" fill="#334155" />
  <text x="172" y="114" text-anchor="end" fill="#f87171" font-size="10.5" font-weight="700">VU (5V)</text>
  <circle cx="179" cy="110" r="3.5" fill="#ef4444" />

  <rect x="106" y="152" width="73" height="22" rx="3" fill="#334155" />
  <text x="172" y="167" text-anchor="end" fill="#60a5fa" font-size="10.5" font-weight="700">D1 (GPIO5)</text>
  <circle cx="179" cy="163" r="3.5" fill="#3b82f6" />

  <rect x="106" y="188" width="73" height="22" rx="3" fill="#334155" />
  <text x="172" y="203" text-anchor="end" fill="#c084fc" font-size="10.5" font-weight="700">D2 (GPIO4)</text>
  <circle cx="179" cy="199" r="3.5" fill="#a855f7" />

  <rect x="106" y="234" width="73" height="22" rx="3" fill="#334155" />
  <text x="172" y="249" text-anchor="end" fill="#cbd5e1" font-size="10.5" font-weight="700">G (GND)</text>
  <circle cx="179" cy="245" r="3.5" fill="#94a3b8" />

  <text x="96.5" y="290" text-anchor="middle" fill="#94a3b8" font-size="9.5">Active-LOW: 0=ON, 1=OFF</text>

  <!-- DC Wires -->
  <path d="M 179 110 L 239 110" stroke="#ef4444" stroke-width="2.2" fill="none" />
  <path d="M 179 163 L 239 163" stroke="#3b82f6" stroke-width="2.2" fill="none" />
  <path d="M 179 199 L 239 199" stroke="#a855f7" stroke-width="2.2" fill="none" />
  <path d="M 179 245 L 239 245" stroke="#94a3b8" stroke-width="2.2" fill="none" />

  <!-- Relay HL-52S V1.0 -->
  <rect x="239" y="58" width="205" height="248" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5" />
  <text x="341.5" y="78" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Relay HL-52S V1.0</text>
  <text x="341.5" y="92" text-anchor="middle" fill="#93c5fd" font-size="9.5">10A 250VAC | Active-LOW</text>

  <rect x="239" y="99" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="246" y="114" fill="#f87171" font-size="10.5" font-weight="700">VCC</text>
  <circle cx="239" cy="110" r="3.5" fill="#ef4444" />

  <rect x="239" y="152" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="246" y="167" fill="#93c5fd" font-size="10.5" font-weight="700">IN1</text>
  <circle cx="239" cy="163" r="3.5" fill="#3b82f6" />

  <rect x="239" y="188" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="246" y="203" fill="#d8b4fe" font-size="10.5" font-weight="700">IN2</text>
  <circle cx="239" cy="199" r="3.5" fill="#a855f7" />

  <rect x="239" y="234" width="46" height="22" rx="3" fill="#1e3a8a" />
  <text x="246" y="249" fill="#cbd5e1" font-size="10.5" font-weight="700">GND</text>
  <circle cx="239" cy="245" r="3.5" fill="#94a3b8" />

  <rect x="247" y="265" width="102" height="31" rx="4" fill="#0f172a" stroke="#475569" />
  <text x="298" y="278" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-weight="600">Jumper JD-VCC</text>
  <text x="298" y="290" text-anchor="middle" fill="#4ade80" font-size="8">Opsional lepas + 5V luar</text>

  <line x1="300" y1="104" x2="300" y2="256" stroke="#facc15" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Relay 1 -->
  <rect x="312" y="104" width="132" height="68" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="320" y="119" fill="#e2e8f0" font-size="9.5" font-weight="700">Relay 1</text>
  <text x="407" y="120" fill="#4ade80" font-size="9.5" font-weight="600">NO1</text>
  <text x="407" y="141" fill="#f87171" font-size="9.5" font-weight="600">COM1</text>
  <text x="407" y="162" fill="#64748b" font-size="9.5">NC1</text>
  <circle cx="444" cy="117" r="3.5" fill="#22c55e" />
  <circle cx="444" cy="138" r="3.5" fill="#ef4444" />
  <circle cx="444" cy="159" r="3.5" fill="#64748b" />
  <line x1="372" y1="138" x2="402" y2="159" stroke="#fbbf24" stroke-width="2.2" />

  <!-- Relay 2 -->
  <rect x="312" y="188" width="132" height="68" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="320" y="203" fill="#e2e8f0" font-size="9.5" font-weight="700">Relay 2</text>
  <text x="407" y="204" fill="#4ade80" font-size="9.5" font-weight="600">NO2</text>
  <text x="407" y="225" fill="#f87171" font-size="9.5" font-weight="600">COM2</text>
  <text x="407" y="246" fill="#64748b" font-size="9.5">NC2</text>
  <circle cx="444" cy="201" r="3.5" fill="#22c55e" />
  <circle cx="444" cy="222" r="3.5" fill="#ef4444" />
  <circle cx="444" cy="243" r="3.5" fill="#64748b" />
  <line x1="372" y1="222" x2="402" y2="243" stroke="#fbbf24" stroke-width="2.2" />

  <!-- Sumber PLN 220V AC -->
  <rect x="502" y="264" width="175" height="62" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="589.5" y="282" text-anchor="middle" fill="#fecaca" font-size="11.5" font-weight="700">Sumber PLN 220V AC</text>
  <text x="518" y="300" fill="#fca5a5" font-size="10" font-weight="700">L (Fasa)</text>
  <circle cx="502" cy="296" r="3.5" fill="#ef4444" />
  <text x="518" y="318" fill="#93c5fd" font-size="10" font-weight="700">N (Netral)</text>
  <circle cx="677" cy="314" r="3.5" fill="#3b82f6" />

  <!-- MCB + Line (Fasa) to COM1 & COM2 -->
  <path d="M 502 296 L 478 296 L 478 274" stroke="#ef4444" stroke-width="2.4" fill="none" />
  <rect x="466" y="250" width="24" height="24" rx="3" fill="#7f1d1d" stroke="#f87171" stroke-width="1.2" />
  <text x="478" y="265" text-anchor="middle" fill="#fef2f2" font-size="7.5" font-weight="700">MCB</text>
  <path d="M 478 250 L 478 222 L 444 222" stroke="#ef4444" stroke-width="2.4" fill="none" />
  <circle cx="478" cy="222" r="3" fill="#ef4444" />
  <path d="M 478 222 L 478 207 A 6 6 0 0 1 478 195 L 478 138 L 444 138" stroke="#ef4444" stroke-width="2.4" fill="none" />

  <!-- Switched Phase NO1 & NO2 -->
  <path d="M 444 117 L 664 117" stroke="#f59e0b" stroke-width="2.4" fill="none" />
  <path d="M 444 201 L 664 201" stroke="#f59e0b" stroke-width="2.4" fill="none" />

  <!-- Neutral (N) -->
  <path d="M 677 314 L 804 314 L 804 117 L 736 117" stroke="#3b82f6" stroke-width="2.4" fill="none" />
  <path d="M 804 201 L 736 201" stroke="#3b82f6" stroke-width="2.4" fill="none" />
  <circle cx="804" cy="201" r="3" fill="#3b82f6" />
  <text x="812" y="260" fill="#60a5fa" font-size="9.5" font-weight="600" transform="rotate(-90 822 260)">Netral (N) Langsung</text>

  <!-- Lamps -->
  <circle cx="700" cy="117" r="19" fill="#1e293b" stroke="#eab308" stroke-width="2.2" />
  <path d="M 689 106 L 711 128 M 711 106 L 689 128" stroke="#eab308" stroke-width="1.8" />
  <text x="700" y="152" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="700">Lampu 220V #1</text>

  <circle cx="700" cy="201" r="19" fill="#1e293b" stroke="#eab308" stroke-width="2.2" />
  <path d="M 689 190 L 711 212 M 711 190 L 689 212" stroke="#eab308" stroke-width="1.8" />
  <text x="700" y="236" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="700">Lampu 220V #2</text>

  <text x="430" y="342" text-anchor="middle" fill="#fca5a5" font-size="9.5" font-weight="600">PERINGATAN: Hanya kabel Fasa (L) yang melewati COM-NO relay. Terminal NC dibiarkan kosong.</text>
</svg>
